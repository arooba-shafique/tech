<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Institutional Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:#0f2744;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 60% at 10% 20%,rgba(20,184,166,.18) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 80%,rgba(37,99,235,.12) 0%,transparent 50%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(124,58,237,.06) 0%,transparent 60%);
  padding:24px;
}

.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(60px);opacity:.15;animation:drift 12s ease-in-out infinite}
.orb1{width:400px;height:400px;background:#14b8a6;top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:#2563eb;bottom:-80px;right:-80px;animation-delay:-4s}
.orb3{width:200px;height:200px;background:#7c3aed;top:50%;left:50%;animation-delay:-8s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,30px) scale(.97)}}

.wrap{position:relative;z-index:10;width:100%;max-width:440px;}

.brand{text-align:center;margin-bottom:36px}
.brand-logo{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg,#14b8a6,#0d9488);
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:26px;color:#fff;
  margin-bottom:16px;
}
.brand-name{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}
.brand-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}

.card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:36px 36px 32px;
  backdrop-filter:blur(20px);
  box-shadow:0 32px 64px rgba(0,0,0,.3);
}

.card-icon{
  width:48px;height:48px;border-radius:14px;
  background:rgba(20,184,166,.15);border:1px solid rgba(20,184,166,.3);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:20px;
}
.card-title{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.4px;margin-bottom:4px}
.card-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px;line-height:1.6}

.form-label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.4);margin-bottom:8px}
.form-input{
  width:100%;padding:12px 16px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;
  font-size:14px;font-family:'DM Sans',sans-serif;
  color:#fff;outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
  margin-bottom:18px;
}
.form-input::placeholder{color:rgba(255,255,255,.25)}
.form-input:focus{
  border-color:rgba(20,184,166,.6);
  background:rgba(20,184,166,.06);
  box-shadow:0 0 0 3px rgba(20,184,166,.12);
}

.btn-submit{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#0d9488,#14b8a6);
  border:none;border-radius:10px;
  font-size:14.5px;font-weight:700;font-family:'DM Sans',sans-serif;
  color:#fff;cursor:pointer;
  box-shadow:0 0 24px rgba(20,184,166,.3);
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(20,184,166,.45)}

.back-link{
  display:block;text-align:center;margin-top:20px;
  font-size:12.5px;font-weight:600;
  color:rgba(255,255,255,.35);text-decoration:none;
}
.back-link:hover{color:rgba(255,255,255,.7)}

.success-msg{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;
  background:rgba(20,184,166,.1);
  border:1px solid rgba(20,184,166,.3);
  border-radius:10px;
  font-size:13px;color:rgba(20,184,166,.9);
  margin-bottom:18px;
  line-height:1.5;
}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="wrap">
  <!-- BRAND -->
  <div class="brand">
    <div class="brand-logo">S</div>
    <div class="brand-name">Student Portal</div>
    <div class="brand-sub">Institutional Management</div>
  </div>

  <!-- CARD -->
  <div class="card">
    <div class="card-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="card-title">Reset Password</div>
    <div class="card-sub">Enter your registered email and we'll send you a link to reset your password.</div>

    {% if request.GET.msg == 'sent' %}
    <div class="success-msg" id="successMsg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="2.5" style="flex-shrink:0;margin-top:1px"><polyline points="20 6 9 17 4 12"/></svg>
      Password reset email sent successfully. Redirecting to login...
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-input" placeholder="Enter your registered email" required autofocus>
      <button type="submit" class="btn-submit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send Reset Link
      </button>
    </form>

    <a href="{% url 'student_login' %}" class="back-link">
      ← Back to Student Login
    </a>
  </div>
</div>

<script>
const msg = document.getElementById("successMsg");
if(msg){
    setTimeout(function(){
        window.location.href = "{% url 'student_login' %}";
    }, 3000); // redirect after 3s
}
</script>

</body>
</html>
