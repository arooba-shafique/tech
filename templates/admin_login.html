<!-- templates/admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: #0f1623;
        /* Allow scroll — use min-height + padding instead of fixed flex centering */
        min-height: 100vh;
        display: flex;
        align-items: flex-start;   /* don't hard-center; let padding do the work */
        justify-content: center;
        padding: 48px 16px 48px;   /* generous top & bottom so nothing clips */
        color: #fff;
        overflow-y: auto;          /* always scrollable if content is tall */
    }

    /* ── Subtle background glow ── */
    body::before {
        content: '';
        position: fixed;
        top: -200px; left: 50%;
        transform: translateX(-50%);
        width: 600px; height: 600px;
        background: radial-gradient(ellipse, rgba(13,148,136,0.12) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
    }

    .login-wrapper {
        position: relative; z-index: 1;
        width: 100%;
        max-width: 400px;
        animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Brand header ── */
    .brand {
        text-align: center;
        margin-bottom: 24px;
    }
    .brand-icon {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0d9488, #0f766e);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 14px;
        box-shadow: 0 8px 24px rgba(13,148,136,0.35);
    }
    .brand-icon svg { width: 26px; height: 26px; }
    .brand h1 {
        font-size: 20px; font-weight: 800;
        color: #fff; letter-spacing: -0.3px;
        margin: 0 0 4px;
    }
    .brand p {
        font-size: 12.5px; color: #64748b; font-weight: 500;
        margin: 0;
    }

    /* ── Card ── */
    .login-card {
        background: #1a2333;
        padding: 32px 30px 28px;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    }

    /* ── Role Switcher ── */
    .role-switcher {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #0f1623;
        border-radius: 9px;
        padding: 4px;
        gap: 3px;
        margin-bottom: 26px;
    }
    .role-btn {
        padding: 9px 6px;
        border: none; border-radius: 7px;
        font-family: inherit;
        font-size: 12.5px; font-weight: 600;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        gap: 6px;
        transition: all 0.2s ease;
        color: #64748b;
        background: transparent;
    }
    .role-btn svg { flex-shrink: 0; }
    .role-btn.active {
        background: #1a2333;
        color: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .role-btn.active.admin   { color: #f5a623; }
    .role-btn.active.manager { color: #0d9488; }
    .role-btn:hover:not(.active) { color: #94a3b8; }

    /* ── Role indicator strip ── */
    .role-strip {
        height: 3px; border-radius: 2px;
        margin-bottom: 22px;
        transition: background 0.3s ease;
    }

    /* ── Section heading ── */
    .form-heading {
        font-size: 15px; font-weight: 700;
        margin-bottom: 18px;
        display: flex; align-items: center; gap: 8px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .form-heading .dot {
        width: 8px; height: 8px; border-radius: 50%;
        flex-shrink: 0;
        transition: background 0.3s;
    }
    .form-heading span { color: #94a3b8; font-weight: 500; font-size: 13px; }

    /* ── Form fields ── */
    .field { margin-bottom: 16px; }
    .field label {
        display: block;
        font-size: 11.5px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.6px;
        color: #64748b;
        margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    .input-wrap svg {
        position: absolute; left: 12px; top: 50%;
        transform: translateY(-50%);
        pointer-events: none; opacity: 0.4;
        width: 15px; height: 15px;
    }
    .input-wrap input {
        width: 100%;
        padding: 10px 12px 10px 36px;
        background: #0f1623;
        border: 1.5px solid #1e2a3a;
        border-radius: 8px;
        font-size: 13.5px; font-family: inherit;
        color: #fff; outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap input::placeholder { color: #3d4f6a; }
    .input-wrap input:focus {
        border-color: #0d9488;
        box-shadow: 0 0 0 3px rgba(13,148,136,0.12);
    }

    /* ── Forgot password ── */
    .forgot-row {
        text-align: right;
        margin-top: -8px;
        margin-bottom: 20px;
    }
    .forgot-row a {
        font-size: 12px; font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s;
    }
    .forgot-row a:hover { opacity: 0.75; }

    /* ── Submit button ── */
    .submit-btn {
        width: 100%;
        padding: 11px;
        border: none; border-radius: 9px;
        font-family: inherit;
        font-size: 14px; font-weight: 700;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: filter 0.2s, transform 0.1s;
        letter-spacing: 0.2px;
    }
    .submit-btn:hover  { filter: brightness(1.1); }
    .submit-btn:active { transform: scale(0.985); }

    /* ── Error messages ── */
    .messages {
        margin-bottom: 18px;
        display: flex; flex-direction: column; gap: 8px;
    }
    .messages p {
        background: rgba(220,38,38,0.15);
        border: 1px solid rgba(220,38,38,0.3);
        color: #fca5a5;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 12.5px;
        display: flex; align-items: center; gap: 7px;
        margin: 0;
    }
    .messages p::before {
        content: '';
        display: inline-block; flex-shrink: 0;
        width: 6px; height: 6px; border-radius: 50%;
        background: #ef4444;
    }

    /* ── Footer ── */
    .login-footer {
        text-align: center;
        margin-top: 18px;
        font-size: 11.5px; color: #2d3f55;
    }

    /* ── Responsive: smaller screens ── */
    @media (max-width: 440px) {
        body { padding: 32px 12px 32px; }
        .login-card { padding: 24px 20px 22px; }
    }
</style>
</head>
<body>

<div class="login-wrapper">

    <!-- Brand -->
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <h1>Management Console</h1>
        <p>Secure Access</p>
    </div>

    <!-- Card -->
    <div class="login-card">

        <!-- Role Switcher -->
        <div class="role-switcher">
            <button class="role-btn admin active" id="btn-admin" onclick="switchRole('admin')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Admin
            </button>
            <button class="role-btn manager" id="btn-manager" onclick="switchRole('manager')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Admin Manager
            </button>
        </div>

        <!-- Role strip -->
        <div class="role-strip" id="role-strip" style="background: linear-gradient(90deg, #f5a623, #d48806);"></div>

        <!-- Heading -->
        <div class="form-heading">
            <div class="dot" id="role-dot" style="background:#f5a623;"></div>
            <span id="role-label">Admin Login</span>
            <span id="role-sublabel">Full dashboard access</span>
        </div>

        <!-- Messages -->
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}

            <!-- Hidden role field -->
            <input type="hidden" name="role" id="role-input" value="admin">

            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required autocomplete="current-password">

                </div>
            </div>

            <div class="forgot-row">
                <a href="{% url 'password_reset' %}" id="forgot-link" style="color:#f5a623;">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn"
                    style="background: linear-gradient(135deg, #f5a623, #d48806); color: #fff;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                <span id="btn-label">Sign in as Admin</span>
            </button>
        </form>
    </div>

    <div class="login-footer">
        © 2025 Management Console · All rights reserved
    </div>
</div>

<script>
    function switchRole(role) {
        const isAdmin = role === 'admin';
        document.getElementById('role-input').value = role;
        document.getElementById('btn-admin')  .classList.toggle('active', isAdmin);
        document.getElementById('btn-manager').classList.toggle('active', !isAdmin);
        document.getElementById('role-strip').style.background = isAdmin
            ? 'linear-gradient(90deg, #f5a623, #d48806)'
            : 'linear-gradient(90deg, #0d9488, #0f766e)';
        document.getElementById('role-dot').style.background = isAdmin ? '#f5a623' : '#0d9488';
        document.getElementById('role-label').textContent    = isAdmin ? 'Admin Login'          : 'Admin Manager Login';
        document.getElementById('role-sublabel').textContent = isAdmin ? 'Full dashboard access' : 'Limited management access';
        document.getElementById('forgot-link').style.color = isAdmin ? '#f5a623' : '#0d9488';
        document.getElementById('submit-btn').style.background = isAdmin
            ? 'linear-gradient(135deg, #f5a623, #d48806)'
            : 'linear-gradient(135deg, #0d9488, #0f766e)';
        document.getElementById('btn-label').textContent = isAdmin ? 'Sign in as Admin' : 'Sign in as Admin Manager';
    }


</script>

</body>
</html>
