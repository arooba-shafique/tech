{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login — Institutional Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0d9488;--teal2:#14b8a6;--blue:#2563eb;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'DM Sans',sans-serif;background:#0f2744;
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  background-image:
    radial-gradient(ellipse 80% 60% at 10% 20%,rgba(20,184,166,.18) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 80%,rgba(37,99,235,.12) 0%,transparent 50%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(124,58,237,.06) 0%,transparent 60%),
    linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,100% 100%,52px 52px,52px 52px;
  padding:24px;
}
.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(60px);opacity:.15;animation:drift 12s ease-in-out infinite}
.orb1{width:400px;height:400px;background:#14b8a6;top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:#2563eb;bottom:-80px;right:-80px;animation-delay:-4s}
.orb3{width:200px;height:200px;background:#7c3aed;top:50%;left:50%;animation-delay:-8s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,30px) scale(.97)}}

.login-wrap{position:relative;z-index:10;width:100%;max-width:440px;}

/* BRAND */
.brand{text-align:center;margin-bottom:20px}
.brand-logo{
  width:54px;height:54px;border-radius:16px;
  background:linear-gradient(135deg,#14b8a6,#0d9488);
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;
  box-shadow:0 0 28px rgba(20,184,166,.4),0 0 0 1px rgba(20,184,166,.3);
  margin-bottom:12px;
}
.brand-name{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px}
.brand-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}

/* CARD */
.card{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:28px 32px 26px;
  backdrop-filter:blur(20px);
  box-shadow:0 32px 64px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);
}
.card-title{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.4px;margin-bottom:4px}
.card-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:20px}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.4);margin-bottom:8px}
.form-input{width:100%;padding:12px 16px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;color:#fff;outline:none;transition:border-color .2s,background .2s,box-shadow .2s;}
.form-input::placeholder{color:rgba(255,255,255,.25)}
.form-input:focus{border-color:rgba(20,184,166,.6);background:rgba(20,184,166,.06);box-shadow:0 0 0 3px rgba(20,184,166,.12);}
.form-input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #0f2c4a inset;-webkit-text-fill-color:#fff;}

/* PASSWORD WRAPPER */
.pw-wrap{position:relative;}
.pw-wrap .form-input{padding-right:46px;}
.eye-btn{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.3);padding:4px;
  display:flex;align-items:center;justify-content:center;
  transition:color .18s;border-radius:6px;
}
.eye-btn:hover{color:rgba(255,255,255,.7);}
.eye-btn:focus{outline:none;}

/* ROLE BADGE */
.role-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:20px;background:rgba(20,184,166,.15);
  color:#14b8a6;border:1px solid rgba(20,184,166,.3);
  margin-bottom:16px;letter-spacing:.3px;
}

/* BTN */
.btn-login{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#0d9488,#14b8a6);
  border:none;border-radius:10px;font-size:14.5px;font-weight:700;
  font-family:'DM Sans',sans-serif;color:#fff;cursor:pointer;
  box-shadow:0 0 24px rgba(20,184,166,.3);
  transition:all .2s;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(20,184,166,.45)}
.btn-login:active{transform:translateY(0)}

/* ERROR / SUCCESS */
.error-msg{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:rgba(225,29,72,.1);
  border:1px solid rgba(225,29,72,.25);border-radius:8px;
  font-size:13px;color:#fda4af;margin-bottom:14px;
}
.success-msg{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:rgba(20,184,166,.1);
  border:1px solid rgba(20,184,166,.25);border-radius:8px;
  font-size:13px;color:#5eead4;margin-bottom:14px;
}

/* FORGOT LINK */
.forgot-link{
  font-size:12px;font-weight:600;
  color:rgba(20,184,166,.8);text-decoration:none;transition:color .15s;
}
.forgot-link:hover{color:#14b8a6}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="login-wrap">

  <!-- BRAND -->
  <div class="brand">
    <div class="brand-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="brand-name">Teacher Portal</div>
    <div class="brand-sub">Teacher Access</div>
  </div>

  <!-- CARD -->
  <div class="card">
    <div class="role-badge">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Teacher Access
    </div>
    <div class="card-title">Welcome Back</div>
    <div class="card-sub">Sign in to access your teaching dashboard</div>

    {% if success_msg %}
    <div class="success-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      {{ success_msg }}
    </div>
    {% endif %}

    {% if error_msg %}
    <div class="error-msg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fda4af" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      {{ error_msg }}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <!-- USERNAME -->
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username" autofocus>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="pw" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePw()" tabindex="-1" aria-label="Toggle password visibility">
            <svg id="iconShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="iconHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div style="text-align:right;margin-top:8px;">
          <a href="{% url 'teacher_password_reset' %}" class="forgot-link">Forgot Password?</a>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
  </div>

</div>

<script>
function togglePw() {
  var pw = document.getElementById('pw');
  var iconShow = document.getElementById('iconShow');
  var iconHide = document.getElementById('iconHide');
  var btn = document.getElementById('eyeBtn');
  if (pw.type === 'password') {
    pw.type = 'text';
    iconShow.style.display = 'none';
    iconHide.style.display = 'block';
    btn.style.color = 'rgba(20,184,166,.8)';
  } else {
    pw.type = 'password';
    iconShow.style.display = 'block';
    iconHide.style.display = 'none';
    btn.style.color = 'rgba(255,255,255,.3)';
  }
}
</script>

</body>
</html>
