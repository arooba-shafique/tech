<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add {{ model_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* General styles */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 20px;
            margin: 0;
            background: #f0f2f5;
        }

        .form-container {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            font-weight: 700;
            font-size: 1.5rem;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px 0;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
                margin: 15px;
            }

            h2 {
                font-size: 1.3rem;
            }

            input, select, textarea {
                font-size: 13px;
                padding: 8px 10px;
            }

            button {
                font-size: 15px;
                padding: 10px 0;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 16px;
                margin: 10px;
            }

            h2 {
                font-size: 1.2rem;
            }

            input, select, textarea {
                font-size: 12px;
                padding: 8px;
            }

            button {
                font-size: 14px;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add {{ model_name }}</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>
    </div>
</body>
</html>
